adr.0014:
  title: Enforce module boundaries with dependency-cruiser; idealo-page package for change-axis isolation
  status: accepted
  date: 2026-10-14
  amends: [adr.0005]
  context:
    problem: god files and directory-level import cycles in apps/extension/src (one SCC of 8 of 13 directories among options, popup, requirements, ratings, filters, page, messaging, diagnostics); views doing IO; platform (messaging) importing features
    file_level_cycles: none today, so no-circular runs at error from the start
    goal: deep modules (small index.ts over a larger implementation), Parnas information hiding, hexagonal ports and adapters, and MVVM-ish feature slices, kept true by a failing command instead of by review
  decision:
    target_layering:
      packages:
        hw-bench: PassMark benchmark model, import, CPU/GPU identity, matching, rating strategies
        idealo-query: query model, URL grammar and search urls, idealo origin, match patterns and host check (side-effect-free subpaths url/constants and url/host for build-time and MAIN-world use), catalog and facets, requirements edits and planning, wire parsing; no DOM, no fetch
        idealo-page: DOM reading of idealo pages behind the PageAdapter port; no extension APIs, no React
        decide: LLM-assisted choice behind the Decider port; the Typesafe AI SDK only in jev/client.ts
        edges: [decide -> hw-bench, decide -> idealo-query, idealo-page -> idealo-query, extension -> every package]
        rule: packages never import apps; cross-sub-domain imports inside a package go through that sub-domain's index.ts
      extension_src:
        contracts: shared kernel, zod schemas and types only (messages, settings, benchmark-snapshot, page-report, ai-test-result, openrouter-status, oauth, error-entry); imports zod, hw-bench, idealo-page and itself
        platform: adapters over wxt, @wxt-dev and @webext-core (messaging, storage, tabs, errors, runtime, locks, download); never features, ui or app
        ui: shared kit (theme, host, components, format); never features, platform or app
        features:
          list: [ai-matching, benchmark-data, capture, diagnostics, filters, ratings, requirements, settings]
          shape: slices with model, view-model, controller, view, adapters and background, plus copy.ts (all user-facing strings) and config.ts (timings, sizes, limits) at the feature root
          public_api: features/<x>/index.ts; cross-feature access only through it
          feature_root: start.tsx (content-script entry of ratings and filters) and connected.tsx (view wired to its controller) sit at the feature root and may import platform; view/, model/ and view-model/ may not
        app: "popup and options screens composing features through their index: app/popup/{PopupScreen, use-page-status, page-summary, copy}, app/options/{OptionsScreen, copy}; may import platform and ui directly"
        entrypoints: composition roots, no logic; popup/main.tsx and options/main.tsx mount the screens, background.ts and the content scripts start features
        r8_adapter_exemption: "app/ and entrypoints/ may import features/<x>/(index|background/index|adapters/(tap|relay)).ts; the capture content scripts import adapters/tap (MAIN world, must not reach the feature index with React and storage) and adapters/relay directly because each world needs its own entry module"
      feature_layers:
        view: pure React over props and callbacks; imports view-model, model types, ui, contracts, react, mantine only
        view_model: pure derivation for display; may call the pure ui/format and ui/theme functions, never ui components or host
        model: pure domain logic over packages, contracts and zod
        controller: hooks, state and IO orchestration
        adapters: IO behind the feature (storage, DOM, network, extension APIs)
        background: service-worker side of a feature, started from entrypoints/background.ts through background/index.ts
      secret_isolation: entrypoints/*.content.ts, popup and options cannot reach the OpenRouter key module or its key provider, transitively (adr.0012); the network tap in the MAIN world cannot reach storage, React, Mantine or ui
    enforcement:
      tool: dependency-cruiser (root devDependency), config .dependency-cruiser.cjs, command just boundaries, part of just check
      severity: every rule runs at error; there are no warn rules and just boundaries reports 0 violations
      deadcode:
        tool: knip (root devDependency), config knip.jsonc, command just deadcode, part of just check
        scope: unused files, exports, types, duplicate exports and unused or unlisted dependencies in every workspace; wxt entrypoints, vitest and playwright specs and each package.json exports entry are entries, so package barrels stay public API and exports used by tests count as used
        complements: R2 no-orphans finds modules nobody imports; knip adds unused exports below a barrel and unused dependencies
      rules: [R1 no-circular, R2 no-orphans, R3 not-to-unresolvable, R4 packages-not-to-apps, R5 pure-packages-no-platform and sdk-only-in-jev-client and sensors-not-to-hw-bench, R6 idealo-page-no-platform and idealo-page-only-idealo-query, R7 package-submodules-via-barrel and cross-feature-via-index, R8 app-screens-via-feature-index and view-is-pure and model-is-pure and platform-not-to-features-or-ui and ui-not-to-features-or-platform and contracts-pure, R9 secret reachability, R10 main-world-tap-is-lean, R11 src-not-to-tests, R12 no-non-package-json]
      layer_rule_scopes:
        view-is-pure: features/<x>/view/ may not import controller, adapters, background, platform or the wxt/@wxt-dev/@webext-core runtimes
        model-is-pure: features/<x>/(model|view-model)/ may not import controller, adapters, view, background, platform, ui components or host (ui/format and ui/theme are allowed), React, Mantine or the extension runtimes
        app-screens-via-feature-index: app/ and entrypoints/ reach into features only through index.ts, background/index.ts and the capture adapters tap.ts and relay.ts
        feature_root_files: start.tsx and connected.tsx at the feature root are outside view-is-pure and model-is-pure and may import platform
      r9_scope: matches the key locations (platform/storage/openrouter-key, features/ai-matching/background/key-provider); the vitest test openrouter-key-isolation stays as a second, independent proof
      resolver_notes:
        - workspace packages are TS source (exports ".": ./src/index.ts); enhancedResolveOptions exportsFields [exports] resolves them to packages/*/src/index.ts
        - specifiers ending ?raw or ?inline are bundler queries; R3 exempts them
        - "WXT auto-imports browser invisibly, so no depcruise rule sees it; Biome style/noRestrictedGlobals (biome.json override) denies browser, chrome, document, window, localStorage, sessionStorage and fetch in src/features/*/(view|model|view-model) and src/ui/components"
      companions:
        godfiles: "just godfiles lists source files over 150 lines (Biome style/noExcessiveLinesPerFile at error in the src and entrypoints override); it exits non-zero on a violation and is part of just lint through biome check"
        manifest_check: "just manifest-check rebuilds the extension and diffs manifest.json (jq -S) against docs/baselines/manifest.chrome-mv3.json"
    idealo_page_package:
      rule_amended: adr.0005 says packages wait for a second consumer; idealo-page is extracted with one consumer (apps/extension)
      reason: change-axis isolation, not reuse. idealo markup redesigns change independently of the URL grammar (idealo-query) and of browser-extension APIs (the app); the package makes that boundary a compile-time and depcruise fact (R6)
      scope: PageAdapter port, ssr-tiles, ssr-product and heuristic adapters, embedded listing, German price parsing, page snapshot, catalog sources, filter-page detection, category to device-class map, HTML fixtures
      limits: tsconfig lib DOM, no wxt or chrome types; depends on idealo-query and zod only
      not_a_precedent: other packages still need a distinct change axis plus a consumer or an IO-purity reason; ui-kit and config packages stay rejected (single consumer, grab-bag)
    test_layout:
      rule: mirrored. test/<src-relative path>/x.test.ts for apps/extension and packages/*/test/<src-relative dir>/x.test.ts; tests move with their module
      imports: relative only; no tsconfig path aliases in the extension, because openrouter-key-isolation follows relative imports
      cross_module_tests: integration tests that span features live under test/integration
  rejected:
    - {alt: eslint-plugin-boundaries, why: needs ESLint and typescript-eslint next to Biome (biome.json is the only linter); element-type rules only and no transitive reachability, so it cannot say "content scripts never reach openrouter-key"}
    - {alt: eslint-plugin-import no-restricted-paths, why: same ESLint cost; path-pair rules only, no cycle and orphan reporting, no capture-group barrel rule}
    - {alt: Nx enforce-module-boundaries, why: needs the Nx project graph and ESLint; task running stays pnpm -r plus justfile}
    - {alt: turbo boundaries, why: experimental and package-level only (no intra-app layers), needs turbo}
    - {alt: Sheriff (softarc), why: barrel-aware and a good fit, but the ESLint plugin is its primary integration and standalone CLI support is unverified}
    - {alt: Biome noRestrictedImports alone, why: per-file pattern bans; no cycles, no transitive rules, no barrel capture groups; kept only as a complement (noRestrictedGlobals in view/, model/, view-model/ and ui/components)}
    - {alt: keep review-only conventions, why: the SCC grew under review; an unenforced layering is not a layering}
  rationale:
    - dependency-cruiser expresses all three rule kinds this repo needs in one config: cycles, capture-group barrel rules ($1 back-references) and transitive reachability (secret isolation)
    - it reads TS source directly, resolves workspace exports, runs standalone with no ESLint, and reports in under a few seconds
  consequences:
    - just check fails on any dependency-cruiser violation (every rule is at error) and on a source file over 150 lines; a change that adds a cycle, a deep cross-feature import or a view that does IO cannot land
    - the one documented exemption is the capture adapters tap.ts and relay.ts, imported directly by their content scripts (r8_adapter_exemption)
    - directory-level cycles are not expressible as dependency-cruiser rules (no-circular is file-level); they disappear by construction once R8 holds
    - the unused ui/mount.tsx (no importers) is deleted; R2 keeps dead modules out
  evidence:
    - context7 /sverweij/dependency-cruiser doc/rules-reference.md and doc/options-reference.md
    - "depcruise 18.6.0 on the pre-refactor tree: 0 errors, no file-level cycles, workspace and ?raw/?inline specifiers resolved"
    - "2026-10-14 post-refactor, just boundaries: 628 modules, 1489 dependencies cruised, 0 violations; all 21 rules at severity error; the directory dependency graph (apps/extension/src/features/<x>, app, contracts, platform, ui; 12 directories) has no strongly connected component of more than one directory (was 1 SCC of 8 of 13)"
    - "2026-10-14 post-refactor, just deadcode (knip 6.41.0): exit 0; the sweep found no unused files or dependencies, resolved 61 unused export and type findings by un-exporting or dropping barrel re-exports, and kept DEFAULT_PRIMARY_ID and DEFAULT_ORIGIN as documented alias constants"
