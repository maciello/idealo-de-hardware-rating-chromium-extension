adr.0001:
  title: MVP rates CPUs and CPU-bearing systems
  status: accepted
  date: 2026-10-14
  decision:
    in_scope: [CPU listings, laptops, desktop PCs (rated via contained CPU)]
    included_early: GPU benchmark parsing (user supplied GPU data; adapter cost ~0)
    deferred: [GPU listing badges, GPU share of system rating]
  rationale: CPU covers the dominant case; GPU matcher (laptop vs desktop variants) is the costly part, not parsing.
  consequences:
    - BenchmarkSource and Matcher are keyed by component kind so GPU plugs in without core change.
