adr.0008:
  title: Read idealo data only from the user's own browser session
  status: accepted-default
  date: 2026-10-14
  decision:
    extension:
      sources_ranked: [embedded searchResult payload (window.csr.initialData), DOM, MAIN-world fetch/XHR tap (debug only)]
      capture_mode: records idealo JSON responses (url, status, body) to local storage; exportable as file
      network_tap: registered at runtime only while capture_mode is on (page fetch/XHR stay native otherwise)
      page_snapshot: popup exports document HTML of the active tab -> ground truth for listing/product/FilterCatalog adapters
      no_extra_requests_to_idealo: true (MVP)
    future_backend_or_mcp:
      preferred: adapter over official idealo MCP (mcp.idealo.com; search_products filters, get_product_details specs)
      constraint: trial AGB forbid productive/end-customer use and data storage; production needs Partner tier
      rejected: server-side scraping (bot protection, ToS)
  findings:
    - id: capture-2026-10-14
      source: user capture export, search "laptop 32GB" in Notebooks
      observed:
        - "GET /suggest?q=<text>&max=10 -> JSON product and query suggestions with OffersOfProduct URLs"
        - "4x POST to obfuscated path /VlzSZFrXQ-8-_VLmYKNKlQwtVKs/... -> 202, empty body"
      conclusion_falsified: "'listing is server-rendered, no product JSON' was wrong; see finding devtools-2026-10-14"
      still_holds: obfuscated POSTs are likely a bot-manager sensor, so patching fetch/XHR on every page is a detection risk
    - id: capture-2026-10-14-product-pages
      source: user capture export, 6 OffersOfProduct pages opened from Notebooks search
      observed:
        - "GET /price-chart/sites/1/products/<productId>/history?period=3M -> {siteId, startDate, data: [{x: YYYY-MM-DD, y: <euro cents>, date: [y, m, d]}]}; days without data omitted"
        - "POST /offerpage/api/sponsored-slider -> {items: [{offer: {productId, title, variantName, price (de-DE string), shopName, relocateUrl (categoryId=3751), ...}}]}; ads, request body not captured"
      conclusion: price history is a clean same-origin GET keyed by productId (the id in OffersOfProduct/<id>_ URLs); calling it from listing tiles would be extra requests, so it stays unused until a feature needs it and no_extra_requests_to_idealo is revisited
    - id: har-2026-10-14
      source: user HAR (sanitized, 0 cookies), Notebooks "laptop 32GB", pages 1-4
      observed:
        - "page 0: server-rendered HTML; tile = [class^=sr-resultItemTile_], id in data-wishlist-heart JSON {id, type: PRODUCT}, full spec line in p[class^=sr-productSummary__mainDetails_] (CPU and GPU names included)"
        - "page 0 HTML filter sidebar: labels + hit counts, no filter ids"
        - "pages >= 1: XHR GET /csr/api/v2/modules/searchResult?categoryId&locale=de_DE&pageIndex&query, application/json, same origin; request carries sessioninfoencrypted + x-growthbook-* headers"
        - "searchResult = {items[] (PRODUCT: characteristics[] with CPU/GPU; OFFER: none), filterGroups[29] with filter ids + hits, priceRanges, sorting, pagination, metadata}"
        - "GET /mvc/metadata/category/<cat>?pageIndex&filters&query&... -> {browserUrl} (web URL for a filter/page state)"
        - "web paging: ProductCategory/3751I16-<15*pageIndex>.html"
      capture_gap: extension captures ran without pagination, so searchResult never fired; filter widened anyway (any idealo host, JSON by parse)
    - id: har-2026-10-14-categories
      source: user HARs (sanitized) of ProductCategory 3020 (PC-System; Gaming/Mini/Office-PC toggles), 3020F720310 (Mini-PC), 3020F1016264 (Workstation), 19116 (Handy), plus the 3751 search document
      observed:
        - "every server-rendered listing inlines the full searchResult payload: window.csr.initialData['searchResult'] = \"<base64 UTF-8 JSON>\", with initialData['categoryId']; same shape as the XHR (items, filterGroups, selectedFilters, metadata, ...) plus sessionInfo (opaque string, never stored)"
        - "searchResult filters=<id> equals the web F-id: filters=953430 -> /mvc/metadata browserUrl ProductCategory/3020F953430.html"
        - "client-side filter toggles fire searchResult + /mvc/metadata + /mvc/resultmetadata + /cn/data/* per change; full navigations (F-id URLs, paging links) re-render server-side"
        - "filterGroups are capped at 100 filters per group (Prozessor, Hersteller)"
        - "Mini-PC page 0: 12/36 PRODUCT tiles name no CPU in characteristics (e.g. Beelink SER8: '3,8 GHz ; 8-Core'); Apple tiles name 'Apple M6' etc."
      capture_note: DevTools drops its log on full navigation unless 'Preserve log' is set, so each HAR holds one document; the extension capture ring persists across navigations
    - id: har-2026-10-14-product-page
      source: user HAR of OffersOfProduct/209657188 (Honor MagicBook Pro 14) + DevTools screenshots
      observed:
        - "no window.csr/phx initialData; title in h1#oopStage-title; full datasheet server-rendered in section#datasheet table: <th colspan=2> section rows, <td>label</td><td>value</td> rows (Notebook-Typ, Prozessor, Grafikkarte, RAM, SSD-Speicher, Gewicht, Markteinführung, ...)"
        - "4 application/ld+json blocks (Product with AggregateOffer lowPrice, ProductGroup, Review, FAQPage); no CPU/GPU in them"
        - "price history GET /price-chart/sites/1/products/<id>/history?period=3M|6M|1Y (periods confirmed by user)"
    - id: live-2026-10-14-multi-filter
      source: headless Chromium (regular browser user agent) from the build env; curl and the HeadlessChrome UA get Akamai 403
      observed:
        - "3751F7612877 (RAM 32 GB) 4319 hits; 3751F7612879 (64 GB) 1737; 3751F7612877-F7612879 -> redirect to 3751F7612877-7612879, 6056 hits = sum: one group ORs"
        - "3751F1466479 (Gaming Notebook) 4146; with RAM 32 GB -> canonical 3751F1466479-7612877 (ids sorted), 1114 hits: groups AND"
        - "mcp.idealo.com/mcp answers 401 without OAuth (DCR + PKCE browser login; trial 3 req/s, 500 calls/day)"
    - id: mcp-2026-10-14
      source: idealo MCP (trial, OAuth) search_products with includeCategories [3751] and [3020], get_product_details on one result; 3 calls
      observed:
        - "availableFilters[] = {attributeId, name, filters: [{filterId, content, amount}]}; filterId and label equal the web F-id and label for every option shared with the embedded payload (3751: 14 groups compared)"
        - "no 100-option cap: Prozessor 280 (3751) / 272 (3020), Grafikkarte 148 / 172, Serie 101"
        - "group names differ from the web payload: Produkttyp (attributeId 15583) = web Notebook-Typ (id productType); Grafikspeicher appears twice (15869 incl. 'Shared Memory', 31502)"
        - "3751 lists 14 groups the web payload omits (Prozessortyp, Prozessor Codename, Display-Technologie, Betriebssystem, ...); still no RAM Typ group for notebooks"
        - "results are variant products (name + nameDelta, productRef token, OffersOfProduct url); get_product_details.productSpecification.groups[].attributes[] carries Prozessor, Grafikkarte, RAM Typ (e.g. DDR5 on a notebook), Grafikspeichertyp as structured values"
      conclusion: the MCP is the complete label source per category (dev-time vocabulary and blind tests); trial terms forbid storage and productive use, so MCP-derived label lists stay out of the repository (local scratch only) and the extension does not call it
    - id: live-2026-10-14-option-cap
      source: headless Chromium (regular UA), 3751F101654343-103705794-104383628-106585393-107023800 (5 Prozessor F-ids, 3 ranked beyond 100 by MCP hit count)
      observed:
        - "embedded Prozessor group lists 100 options (sorted by position, plus popularFilters top 5); only 106585393 of the 5 url F-ids is listed"
        - "selectedFilters names only the listed one; the h1 and the listed option's disable link carry all 5, and the results include the unlisted CPUs"
      conclusion: idealo applies every F-id in the url, listed or not; which options are listed depends on the filter state, so an F-id selected under one state can be invisible under the next
  decision_update:
    product_page: datasheet table rows as "Label\tValue" spec text (hw-bench parseSpecBlock); title from h1#oopStage-title
    listing_tiles: DOM adapter over tile markup for placement and product id (data-wishlist-heart); spec text from the embedded payload when the tile id is in it, else the tile's main-details line (client-rendered pages)
    filter_catalog: parseSearchResult over readEmbeddedSearchResult (packages/idealo-query) of the current document, then the DOM link catalog; after client-side filter changes the payload is stale but its F-ids stay valid
    filter_vocabulary: every catalog served is merged (mergeCatalogs) into a per-category union of options in extension storage (local:filterVocabulary, labels and F-ids only); the planner sees the union so it can replace and select options the current state does not list (finding live-2026-10-14-option-cap)
    no_extra_requests_to_idealo: true (the embedded payload makes the planned page-0 GET unnecessary)
    capture_tap: debug only; records idealo hosts only so the 300-entry ring spans more pages
  unknowns:
    - filter-definition endpoint URL/shape (unobserved)
    - meaning of opaque URL suffix like "oE0oJ1"
  consequences:
    - FilterCatalog and spec extraction are ports; first real adapters written from capture-mode exports.
