adr.0012:
  title: OpenRouter API key via OAuth PKCE
  status: accepted
  date: 2026-10-14
  context:
    need: Jev (adr.0011) and any future model call need an OpenRouter key; pasting keys is friction and invites leaks
    openrouter_pkce:
      authorize: "https://openrouter.ai/auth?callback_url=<url>&code_challenge=<b64url sha256(verifier)>&code_challenge_method=S256"
      callback_url_rule: https, or localhost/127.0.0.1 on any port
      exchange: "POST https://openrouter.ai/api/v1/auth/keys {code, code_verifier, code_challenge_method} -> {key, user_id}"
  decision:
    extension:
      flow: browser.identity.launchWebAuthFlow with callback browser.identity.getRedirectURL() (https://<extension-id>.chromiumapp.org/), run in background service worker, triggered from options page
      storage: local:openrouterKey {key, userId, obtainedAt}; options page sees connection status only, never the key
      port: KeyProvider (apps/extension/src/ai/key-provider.ts), background-only
      revoke: disconnect deletes the local key; server-side revocation at openrouter.ai/settings/keys
    dev_and_ci: same PKCE flow with a localhost callback; key kept outside the repo (OPENROUTER_API_KEY env); live tests skip without it
  consequences:
    - "permissions: identity; host_permissions: https://openrouter.ai/*"
    - one key per user; spend limits are set by the user on openrouter.ai
  evidence: ["https://openrouter.ai/docs/guides/overview/auth/oauth", "https://openrouter.ai/docs/api/api-reference/oauth/exchange-authorization-code-for-api-key"]
  open:
    - Brave support for chrome.identity.launchWebAuthFlow unverified
